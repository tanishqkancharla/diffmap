<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        var preference = "system";
        try {
          var storedPreference = window.localStorage.getItem("maui-theme");
          if (
            storedPreference === "system" ||
            storedPreference === "light" ||
            storedPreference === "dark"
          ) {
            preference = storedPreference;
          }
        } catch {}

        var theme =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;

        var scale = "system";
        try {
          var storedScale = window.localStorage.getItem("maui-scale");
          if (
            storedScale === "system" ||
            storedScale === "medium" ||
            storedScale === "large"
          ) {
            scale = storedScale;
          }
        } catch {}
        document.documentElement.dataset.scale =
          scale === "system"
            ? window.matchMedia("(pointer: coarse)").matches
              ? "large"
              : "medium"
            : scale;
      })();
    </script>
    <title>diffmap — landing prototype</title>
    <meta name="description" content="A document format for agentic review." />
