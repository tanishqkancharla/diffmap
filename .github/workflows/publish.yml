# Stages @tanishqkancharla/diffmap from main using npm Trusted Publishing (OIDC).
# Uses `npm stage publish` only (not `npm publish`). A maintainer must approve on npmjs.com.
# No NPM_TOKEN. Provenance is emitted automatically by trusted publishing; --provenance
# is also passed so a stage still attests if OIDC is configured.
#
# One-time npmjs.com setup (Package → Settings → Trusted Publisher → GitHub Actions):
#   Organization or user: tanishqkancharla
#   Repository:           diffmap
#   Workflow filename:    publish.yml
#   Environment name:     (leave blank — this workflow does not use an environment)
#   Allowed actions:      npm stage publish only (do not enable npm publish)
name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # setup-node still writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # when registry-url is set. With no NODE_AUTH_TOKEN, that expands empty and
      # npm treats classic auth as configured, so it never starts the OIDC exchange.
      - name: Drop empty npm auth token so OIDC can run
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Require npm 11.15.0+ for staged OIDC
        run: |
          node <<'EOF'
          const { execSync } = require("node:child_process");
          function npmVersion() {
            return execSync("npm --version", { encoding: "utf8" }).trim();
          }
          function isNewEnough(version) {
            const [major, minor] = version.split(".").map((n) => parseInt(n, 10));
            return major > 11 || (major === 11 && minor >= 15);
          }
          let version = npmVersion();
          if (!isNewEnough(version)) {
            console.log(
              `npm ${version} is too old for npm stage; installing 11.15.0`,
            );
            execSync("npm install -g npm@11.15.0", { stdio: "inherit" });
            version = npmVersion();
          }
          if (!isNewEnough(version)) {
            console.error(
              `npm stage publish needs npm >= 11.15.0; found ${version}`,
            );
            process.exit(1);
          }
          console.log(`npm ${version}`);
          EOF

      - name: Publish only if package.json is newer than npm
        id: decide
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");
          const pkg = require("./package.json");
          const expected = "@tanishqkancharla/diffmap";

          if (pkg.name !== expected) {
            console.error(
              `Refusing to publish "${pkg.name}". Only ${expected} is allowed.`,
            );
            process.exit(1);
          }

          function writeOutput(shouldPublish) {
            const out = process.env.GITHUB_OUTPUT;
            if (out) {
              fs.appendFileSync(out, `should_publish=${shouldPublish}\n`);
            }
          }

          function npmViewVersion(name) {
            const result = spawnSync("npm", ["view", name, "version"], {
              encoding: "utf8",
            });
            if (result.status === 0) {
              return result.stdout.trim();
            }
            const output = `${result.stdout}${result.stderr}`;
            if (/E404|404 Not Found|not in this registry/i.test(output)) {
              return null;
            }
            console.error(output);
            process.exit(result.status === null ? 1 : result.status);
          }

          function isNewer(local, published) {
            const parse = (v) => {
              const [core, pre = ""] = v.split("-");
              const nums = core.split(".").map((n) => parseInt(n, 10) || 0);
              while (nums.length < 3) nums.push(0);
              return { nums, pre };
            };
            const a = parse(local);
            const b = parse(published);
            for (let i = 0; i < 3; i++) {
              if (a.nums[i] !== b.nums[i]) {
                return a.nums[i] > b.nums[i];
              }
            }
            if (!a.pre && b.pre) {
              return true;
            }
            if (a.pre && !b.pre) {
              return false;
            }
            return a.pre > b.pre;
          }

          const published = npmViewVersion(pkg.name);
          if (published === pkg.version) {
            console.log(
              `${pkg.name}@${pkg.version} is already on npm; skipping publish.`,
            );
            writeOutput("false");
            process.exit(0);
          }
          if (published && !isNewer(pkg.version, published)) {
            console.log(
              `package.json ${pkg.version} is not newer than npm ${published}; skipping publish.`,
            );
            writeOutput("false");
            process.exit(0);
          }

          console.log(
            published
              ? `Will publish ${pkg.name}@${pkg.version} (npm has ${published}).`
              : `Will publish ${pkg.name}@${pkg.version} (not yet on npm).`,
          );
          writeOutput("true");
          EOF

      - name: Install
        if: steps.decide.outputs.should_publish == 'true'
        run: npm ci

      - name: Test
        if: steps.decide.outputs.should_publish == 'true'
        run: npm test

      - name: Stage
        if: steps.decide.outputs.should_publish == 'true'
        run: npm stage publish --access public --provenance
