<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        var preference = "system";
        try {
          var storedPreference = window.localStorage.getItem("maui-theme");
          if (
            storedPreference === "system" ||
            storedPreference === "light" ||
            storedPreference === "dark"
          ) {
            preference = storedPreference;
          }
        } catch {}

        var theme =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;

        var scale = "system";
        try {
          var storedScale = window.localStorage.getItem("maui-scale");
          if (
            storedScale === "system" ||
            storedScale === "medium" ||
            storedScale === "large"
          ) {
            scale = storedScale;
          }
        } catch {}
        document.documentElement.dataset.scale =
          scale === "system"
            ? window.matchMedia("(pointer: coarse)").matches
              ? "large"
              : "medium"
            : scale;
      })();
    </script>
    <title>diffmap</title>
    <!-- A + over a −, like a diff. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181b'/%3E%3Crect x='14.25' y='5.5' width='3.5' height='11' rx='1.75' fill='%233fb950'/%3E%3Crect x='10.5' y='9.25' width='11' height='3.5' rx='1.75' fill='%233fb950'/%3E%3Crect x='10.5' y='21.25' width='11' height='3.5' rx='1.75' fill='%23f85149'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/viewer/main.tsx"></script>
  </body>
</html>
