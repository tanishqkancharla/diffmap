services:
  diffmap:
    # Amp sets __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS to the portal hostname, so Vite accepts portal requests.
    command: node --import tsx src/cli.ts serve fixtures/sample.mdx --port "$PORT"
    portal:
      title: diffmap
      description: Serves fixtures/sample.mdx. Run the CLI on another file to view it.
